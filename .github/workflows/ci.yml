name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Read pinned toolchain from cyrius.cyml (single source of
        # truth, matches patra/vani/sakshi/mihi CI). Version-pinned
        # install layout — cycc 6.0.1's stdlib resolver prefers this
        # path. Pre-flight HTTP check surfaces a clear error if the
        # cyml pin is bumped ahead of the published release.
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::cyrius.cyml's 'cyrius =' pin was bumped ahead of the published release."
            exit 1
          fi
          curl -sLO "$URL"
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/lib.cyr build/bsp
          echo "bsp: $(wc -c < build/bsp) bytes"

  test:
    name: Test (168 assertions)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          set -e
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          TARBALL="cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          URL="https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/$TARBALL"
          HTTP_CODE=$(curl -sL -o /dev/null -w "%{http_code}" -I "$URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "302" ]; then
            echo "::error::Cyrius release $CYRIUS_VERSION not found on GitHub (HTTP $HTTP_CODE)."
            echo "::error::cyrius.cyml's 'cyrius =' pin was bumped ahead of the published release."
            exit 1
          fi
          curl -sLO "$URL"
          tar xzf "$TARBALL"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin/"* 2>/dev/null || true
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/bin" "$HOME/.cyrius/bin"
          ln -sfn "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" "$HOME/.cyrius/lib"
          echo "$CYRIUS_VERSION" > "$HOME/.cyrius/current"
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        run: cyrius deps

      # Grade on the EXIT STATUS, not on grepping stdout. The old form
      # (`cyrius test ... | tee out` then `grep "0 failed"`) was false-green
      # twice over: the pipe discarded cyrius's exit status, and "0 failed"
      # is a SUBSTRING of "10 failed" — so a run reporting
      # "0 passed, 10 failed" matched the guard and the job went green.
      # Reachable at 10/20/.../100 failures within today's 168 assertions.
      - name: Run tests
        run: |
          ec=0
          cyrius test tests/bsp.tcyr > /tmp/test_output 2>&1 || ec=$?
          cat /tmp/test_output
          [ "$ec" -eq 0 ] || { echo "::error::cyrius test exited $ec"; exit 1; }
          grep -Eq '(^| )0 failed' /tmp/test_output || { echo "::error::no clean summary line"; exit 1; }

      # The 3 harnesses have always been the project's most productive gate
      # (they found the SIGFPE, negative-width and divide-by-zero bugs that
      # the unit tests missed) but CI never ran them — they were named
      # fuzz/*.cyr, and `cyrius fuzz` only discovers fuzz/*.fcyr, so it
      # reported "no harnesses found" and exited 0. Renamed in 1.2.2.
      # `cyrius fuzz` derives its denominator from whatever it finds, so
      # "1 passed, 0 failed" is a PASS even with 2 harnesses missing —
      # hence the explicit floor of 3.
      - name: Run fuzz harnesses
        run: |
          ec=0
          cyrius fuzz > /tmp/fuzz_output 2>&1 || ec=$?
          cat /tmp/fuzz_output
          [ "$ec" -eq 0 ] || { echo "::error::cyrius fuzz exited $ec"; exit 1; }
          grep -q "No fuzz harnesses found" /tmp/fuzz_output && { echo "::error::fuzz harnesses not discovered — are they named fuzz/*.fcyr?"; exit 1; }
          grep -Eq '(^| )0 failed' /tmp/fuzz_output || { echo "::error::fuzz reported failures"; exit 1; }
          PASSED=$(grep -oE '[0-9]+ passed' /tmp/fuzz_output | tail -1 | cut -d' ' -f1)
          [ "${PASSED:-0}" -ge 3 ] || { echo "::error::expected >=3 fuzz harnesses, ran ${PASSED:-0}"; exit 1; }

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required docs
        # cyrius.toml retired in 1.1.3; cyrius.cyml is the single
        # manifest (matches patra/vani/sakshi/mihi).
        run: |
          for doc in README.md CHANGELOG.md VERSION LICENSE cyrius.cyml; do
            test -f "$doc" && echo "OK: $doc" || { echo "MISSING: $doc"; exit 1; }
          done

      - name: Verify version consistency
        # `${file:VERSION}` template in cyrius.cyml — resolve to the
        # VERSION file contents for the consistency check. Same shape
        # as patra/vani CI.
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          CYML_RAW=$(grep '^version = ' cyrius.cyml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$CYML_RAW" = "\${file:VERSION}" ]; then
              CYML_VERSION="$FILE_VERSION"
          else
              CYML_VERSION="$CYML_RAW"
          fi
          [ "$FILE_VERSION" = "$CYML_VERSION" ] || { echo "VERSION ($FILE_VERSION) != cyrius.cyml ($CYML_RAW)"; exit 1; }
          grep -q "$FILE_VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          # dist/bsp.cyr is what consumers actually vendor, so a stale bundle
          # header is a shipped-wrong-version bug. `cyrius distlib` stamps this
          # line from VERSION — a mismatch means the bundle was not regenerated.
          DIST_VERSION=$(grep '^# Version: ' dist/bsp.cyr | head -1 | sed 's/# Version: //' | tr -d '[:space:]')
          [ "$FILE_VERSION" = "$DIST_VERSION" ] || { echo "VERSION ($FILE_VERSION) != dist/bsp.cyr ($DIST_VERSION) — run 'cyrius distlib'"; exit 1; }
          echo "Version consistent: $FILE_VERSION (cyml: $CYML_RAW, dist: $DIST_VERSION)"
